<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t-approval d-approval" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t-approval">Human approval gate</title><desc id="d-approval">Panel contrasting allowed approval steps with forbidden automation.</desc>
<defs><linearGradient id="bg-approval" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1f"/><stop offset="1" stop-color="#0b1f45"/></linearGradient>
<linearGradient id="ac-approval" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
<rect width="1200" height="420" rx="22" fill="url(#bg-approval)"/>
<circle cx="1110" cy="60" r="140" fill="#22d3ee" opacity="0.06"/><circle cx="80" cy="400" r="120" fill="#3b82f6" opacity="0.07"/>
<text x="48" y="58" font-size="14" letter-spacing="3" fill="#22d3ee" font-weight="700">STEP 4</text>
<text x="48" y="96" font-size="32" font-weight="800" fill="#f1f8ff">Human approval gate</text>
<rect x="48" y="112" width="120" height="4" rx="2" fill="url(#ac-approval)"/>
<g><rect x="48" y="150" width="520" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="48" y="150" width="6" height="210" rx="3" fill="#22d3ee"/><text x="70" y="184" font-size="18" font-weight="700" fill="#e2f3ff">Allowed</text><text x="70" y="214" font-size="15" fill="#9fb7d9">✓ Show exact copy + target account</text><text x="70" y="240" font-size="15" fill="#9fb7d9">✓ Fresh approval for each post or DM</text><text x="70" y="266" font-size="15" fill="#9fb7d9">✓ Publish via supported connector flow</text></g><g><rect x="600" y="150" width="552" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="600" y="150" width="6" height="210" rx="3" fill="#f472b6"/><text x="622" y="184" font-size="18" font-weight="700" fill="#e2f3ff">Never</text><text x="622" y="214" font-size="15" fill="#9fb7d9">✗ Auto-posting from routines or agents</text><text x="622" y="240" font-size="15" fill="#9fb7d9">✗ Session scraping or pasted tokens</text><text x="622" y="266" font-size="15" fill="#9fb7d9">✗ Mass replies, hashtag stuffing, bait</text></g>
<text x="1152" y="400" font-size="12" text-anchor="end" fill="#5d7aa6">Illustrative example data — not live X metrics</text></svg>
