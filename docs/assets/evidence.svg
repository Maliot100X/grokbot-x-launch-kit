<g><rect x="48" y="150" width="1104" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="48" y="150" width="6" height="210" rx="3" fill="#22d3ee"/><text x="70" y="184" font-size="18" font-weight="700" fill="#e2f3ff">Every claim traces back to a retained raw tool result</text><text x="70" y="214" font-size="15" fill="#9fb7d9">sourceTool: x.search_posts_all   rawResultId: search-23424977   retrievedAt: 2026-01-15T18:00:00Z</text><text x="70" y="240" font-size="15" fill="#9fb7d9">url: https://x.com/example_user/status/…   createdAt validated against snowflake ID (±60s)</text><text x="70" y="266" font-size="15" fill="#9fb7d9">Missing metrics are rejected — never filled with zero. Fixtures and mocks are refused as live input.</text></g>
