<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t-hero d-hero" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t-hero">Research first. Draft second. Post only with approval.</title><desc id="d-hero">Three-step flow: live research, three evidence-linked drafts, human approval before any post.</desc>
<defs><linearGradient id="bg-hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b1f"/><stop offset="1" stop-color="#0b1f45"/></linearGradient>
<linearGradient id="ac-hero" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
<rect width="1200" height="420" rx="22" fill="url(#bg-hero)"/>
<circle cx="1110" cy="60" r="140" fill="#22d3ee" opacity="0.06"/><circle cx="80" cy="400" r="120" fill="#3b82f6" opacity="0.07"/>
<text x="48" y="58" font-size="14" letter-spacing="3" fill="#22d3ee" font-weight="700">GROKBOT · X LAUNCH KIT</text>
<text x="48" y="96" font-size="32" font-weight="800" fill="#f1f8ff">Research first. Draft second. Post only with approval.</text>
<rect x="48" y="112" width="120" height="4" rx="2" fill="url(#ac-hero)"/>
<g><rect x="48" y="150" width="350" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="48" y="150" width="6" height="210" rx="3" fill="#22d3ee"/><text x="70" y="184" font-size="18" font-weight="700" fill="#e2f3ff">1 · Live research</text><text x="70" y="214" font-size="15" fill="#9fb7d9">Trends: worldwide + United States</text><text x="70" y="240" font-size="15" fill="#9fb7d9">High-engagement examples</text><text x="70" y="266" font-size="15" fill="#9fb7d9">Real URLs, timestamps, metrics</text></g><g><rect x="425" y="150" width="350" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="425" y="150" width="6" height="210" rx="3" fill="#3b82f6"/><text x="447" y="184" font-size="18" font-weight="700" fill="#e2f3ff">2 · Three drafts</text><text x="447" y="214" font-size="15" fill="#9fb7d9">Question · Observation · Discussion</text><text x="447" y="240" font-size="15" fill="#9fb7d9">Evidence-linked, pending review</text><text x="447" y="266" font-size="15" fill="#9fb7d9">No virality guarantees</text></g><g><rect x="802" y="150" width="350" height="210" rx="14" fill="#0f1d3a" stroke="#1e3a6b"/><rect x="802" y="150" width="6" height="210" rx="3" fill="#38bdf8"/><text x="824" y="184" font-size="18" font-weight="700" fill="#e2f3ff">3 · You approve</text><text x="824" y="214" font-size="15" fill="#9fb7d9">No auto-posts or auto-DMs</text><text x="824" y="240" font-size="15" fill="#9fb7d9">Supported approval flow only</text><text x="824" y="266" font-size="15" fill="#9fb7d9">Measure 1h · 6h · 24h</text></g>
<text x="1152" y="400" font-size="12" text-anchor="end" fill="#5d7aa6">Illustrative example data — not live X metrics</text></svg>
